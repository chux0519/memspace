# Pushing a tag v* builds and publishes a GitHub release:
# - memspace-<os>-<arch>[.exe]: the client (pure Go, cross-compiled)
# - memspace-server-<os>-<arch>: the full binary (server + client; cgo,
#   built natively per platform)
# - SHA256SUMS, LICENSE, NOTICE
# Tags with a pre-release suffix (v0.2.0-rc.1) publish pre-releases.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build clients
        run: |
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${p%/*}; arch=${p#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "dist/memspace-$os-$arch$ext" ./cmd/memspace
          done
      - name: Check the version
        run: |
          got=$(dist/memspace-linux-amd64 --version)
          echo "$got"
          [ "$got" = "memspace version $GITHUB_REF_NAME" ]
      - uses: actions/upload-artifact@v4
        with:
          name: clients
          path: dist/

  servers:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binary runs on Debian 12 and newer.
          - { runner: ubuntu-22.04, os: linux, arch: amd64 }
          - { runner: ubuntu-22.04-arm, os: linux, arch: arm64 }
          - { runner: macos-14, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: CGO_ENABLED=1 go test -tags sqlite_fts5 -short -count=1 ./...
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -tags sqlite_fts5 -trimpath -o "dist/memspace-server-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/memspace
      - name: Check the version
        run: |
          got=$(dist/memspace-server-${{ matrix.os }}-${{ matrix.arch }} --version)
          echo "$got"
          [ "$got" = "memspace version $GITHUB_REF_NAME" ]
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    needs: [clients, servers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir -p dist
          cp artifacts/* dist/
          cp LICENSE NOTICE dist/
          chmod +x dist/memspace-*
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "MemSpace $GITHUB_REF_NAME" $flags
